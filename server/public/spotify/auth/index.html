<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spotify login</title>

  <link rel="stylesheet" href="/src/css/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css">
</head>
<body>
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
  <script>
    const fetchAuthUrl = async () => {
      const param = new URLSearchParams(window.location.search);
      const state = param.get("state");

      let endpoint = atob(state)

      
      if (endpoint.includes("localhost:") || endpoint.includes("127.0.0.1:")) {
        endpoint = `http://${endpoint}`
      } else {
        endpoint = `https://${endpoint}`
      }

      window.location.replace(`${endpoint}/api/spotify/auth?state=${state}`);
    }

    fetchAuthUrl();
  </script>
</body>
</html>
