<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>packed token</title>
</head>
<body>
  
  <script>
    const slug = new URLSearchParams(window.location.search);
    const data = JSON.parse(atob(slug.get("token")));
    const state = slug.get("state")


    window.sessionStorage.setItem("spotify_token", JSON.stringify(data));

    window.location.replace(`/controller?id=${state}`)
  </script>
</body>
</html>
